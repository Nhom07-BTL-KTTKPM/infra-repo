name: cosmetics-platform
# NOTE: This is intentionally consolidated for the current dev phase.
# TODO: Split into smaller domain-specific compose overlays later (apps/event/ai) when the codebase stabilizes.

services:
  postgres:
    image: postgres:16-alpine
    container_name: infra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-platform_db}
      POSTGRES_MULTIPLE_DATABASES: auth_db,user_db,catalog_db,cart_db,order_db,notification_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - cosmetics-net

  redis:
    image: redis:7-alpine
    container_name: infra-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - cosmetics-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: infra-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - cosmetics-net

  mongo:
    image: mongo:7
    container_name: infra-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-root}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-admin}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - cosmetics-net

  discovery-service:
    build:
      context: ../discovery-repo/discovery-service
      dockerfile: ../../infra-repo/docker/spring-boot-service.Dockerfile
    image: cosmetics/discovery-service:dev
    container_name: discovery-service
    restart: unless-stopped
    env_file:
      - ../discovery-repo/discovery-service/.env
    ports:
      - "8761:8761"
    networks:
      - cosmetics-net

  api-gateway:
    build:
      context: ..
      dockerfile: api-gateway-repo/api-gateway/Dockerfile
    image: cosmetics/api-gateway:dev
    container_name: api-gateway
    restart: unless-stopped
    env_file:
      - ../api-gateway-repo/api-gateway/.env
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      discovery-service:
        condition: service_started
    networks:
      - cosmetics-net

networks:
  cosmetics-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  mongo_data:
