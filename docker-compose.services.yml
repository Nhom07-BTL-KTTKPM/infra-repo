      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ""
      SPRING_DATA_REDIS_TIMEOUT: 2s
      AUTH_JWT_ISSUER: auth-service
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-NUQyuZhoBd6u6O6dAP30Rgu5bqv5TdzpKreGhZGExSaHXEQIM3kicw9uptSaJP9Q}
      EUREKA_DEFAULT_ZONE: http://discovery-service:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      EUREKA_INSTANCE_IP_ADDRESS: cart-service
      EUREKA_INSTANCE_HOSTNAME: cart-service
    ports:
      - "8084:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
