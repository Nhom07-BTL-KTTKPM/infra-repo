# NOTE: This file is intentionally consolidated for day-to-day development.
# TODO: Split into smaller service overlays later (apps/event/ai) when service ownership and deployment boundaries are finalized.

services:
  auth-service:
    build:
      context: ../auth-repo/auth-service
      dockerfile: ../../infra-repo/docker/spring-boot-service.Dockerfile
    image: cosmetics/auth-service:dev
    container_name: auth-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      EUREKA_DEFAULT_ZONE: http://discovery-service:8761/eureka/
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      discovery-service:
        condition: service_started
    networks:
      - cosmetics-net

  user-service:
    build:
      context: ../user-repo/user-service
      dockerfile: ../../infra-repo/docker/spring-boot-service.Dockerfile
    image: cosmetics/user-service:dev
    container_name: user-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/user_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ""
      SPRING_DATA_REDIS_TIMEOUT: 2s
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-guest}
      AUTH_JWT_ISSUER: auth-service
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-NUQyuZhoBd6u6O6dAP30Rgu5bqv5TdzpKreGhZGExSaHXEQIM3kicw9uptSaJP9Q}
      AUTH_RABBITMQ_CRITICAL_EXCHANGE: critical.exchange
      USER_RABBITMQ_ACCOUNT_CREATED_QUEUE: user.account.created.queue
      USER_RABBITMQ_ROUTING_ACCOUNT_CREATED: account.created
      USER_SERVICE_INTERNAL_AUTH_HEADER_NAME: X-Internal-Api-Key
      USER_SERVICE_INTERNAL_AUTH_API_KEY: ${USER_SERVICE_INTERNAL_AUTH_API_KEY:-change-me-in-prod}
      EUREKA_DEFAULT_ZONE: http://discovery-service:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      EUREKA_INSTANCE_IP_ADDRESS: user-service
      EUREKA_INSTANCE_HOSTNAME: user-service
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      discovery-service:
        condition: service_started
    networks:
      - cosmetics-net

  catalog-service:
    build:
      context: ../catalog-repo/catalog-service
      dockerfile: ../../infra-repo/docker/spring-boot-service.Dockerfile
    image: cosmetics/catalog-service:dev
    container_name: catalog-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalog_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      EUREKA_DEFAULT_ZONE: http://discovery-service:8761/eureka/
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_started
    networks:
      - cosmetics-net

  cart-service:
