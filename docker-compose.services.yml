# NOTE: This file is intentionally consolidated for day-to-day development.
# TODO: Split into smaller service overlays later (apps/event/ai) when service ownership and deployment boundaries are finalized.

services:
  auth-service:
    build:
      context: ../auth-repo/auth-service
      dockerfile: ../../infra-repo/docker/spring-boot-service.Dockerfile
    image: cosmetics/auth-service:dev
    container_name: auth-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      EUREKA_DEFAULT_ZONE: http://discovery-service:8761/eureka/
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      discovery-service:
        condition: service_started
    networks:
      - cosmetics-net

  user-service:
    build:
      context: ../user-repo/user-service
      dockerfile: ../../infra-repo/docker/spring-boot-service.Dockerfile
    image: cosmetics/user-service:dev
