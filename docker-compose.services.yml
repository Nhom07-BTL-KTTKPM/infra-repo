  ai-service:
    build:
      context: ../ai-repo/ai-service
      dockerfile: ../../infra-repo/docker/spring-boot-service.Dockerfile
    image: cosmetics/ai-service:dev
    container_name: ai-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-root}:${MONGO_INITDB_ROOT_PASSWORD:-root}@mongo:27017/ai_db?authSource=admin
      EUREKA_DEFAULT_ZONE: http://discovery-service:8761/eureka/
    ports:
      - "8086:8080"
    depends_on:
      mongo:
        condition: service_healthy
      discovery-service:
        condition: service_started
    networks:
      - cosmetics-net

  notification-service:
